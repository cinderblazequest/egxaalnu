app = "spas-ai"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[experimental]
  auto_rollback = true

# Default ловит trafic на 8080 (health-check + опционально webhook proxy).
# Telegram polling-режим не требует отдельного входящего трафика.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

# Опциональный webhook-эндпоинт (если WEBHOOK_MODE=1).
# Telegram приходит на 443 → Fly прокидывает на internal_port 8443.
[[services]]
  internal_port = 8443
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = true

  [[services.http_checks]]
    interval = "60s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    tls_skip_verify = false

[mounts]
  source = "spas_data"
  destination = "/data"

[env]
  DB_PATH = "/data/spas.db"
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"
  HEALTH_PORT = "8080"
  WEBHOOK_PORT = "8443"

# 512 MB вместо 256 — SQLite + aiogram + Pillow + опциональный webhook
# спокойно влезают, остаётся запас под пики.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
