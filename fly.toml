app = "spas-ai"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "spas_data"
  destination = "/data"

[env]
  DB_PATH = "/data/spas.db"
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "INFO"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
