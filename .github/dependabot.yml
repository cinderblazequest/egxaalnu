version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    target-branch: main
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      ci-test-tools:
        patterns: ["pytest*", "ruff*", "pre-commit*", "pytest-cov*"]
      runtime:
        patterns: ["aiogram", "aiohttp", "aiosqlite", "pydantic", "Pillow", "qrcode*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
